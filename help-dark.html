<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continu · PowerPoint Help</title>
<style>
:root{--navy:#2A4356;--navy2:#324E64;--green:#B5EB03;--sage:#9AC490;--sky:#A5D4F0;--mist:#C2D0DA;--mauve:#CEA1C6;--stone:#B8C2B2;--pale:#E6EAE4;
  --bg:#fff;--ink:#2A4356;--soft:#F3F5F2;--soft2:#fff;--muted:#5F7383;--line:#E3E7E1;--pillOn:#fff;--pillOnInk:#2A4356;--panel:#fff;--logo:#2A4356}
body.dark{--bg:#2A4356;--ink:#fff;--soft:#324E64;--soft2:#3A5A72;--muted:#B8C2B2;--line:rgba(255,255,255,.12);--pillOn:#B5EB03;--pillOnInk:#2A4356;--panel:#324E64;--logo:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#2A4356}
body{min-height:100vh;color:var(--ink);font-family:Effra,"Inter","Segoe UI",system-ui,sans-serif;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.pad{padding-left:clamp(20px,3.5vw,64px);padding-right:clamp(20px,3.5vw,64px)}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:24px;padding-bottom:24px;position:relative;z-index:3}
.logo{height:56px;width:auto;color:var(--logo);display:block}
.pills{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:5px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:999px;font-size:14px}
.pill:hover{background:var(--soft2)}
.pill.on{background:var(--pillOn);color:var(--pillOnInk);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:10px 16px;width:min(300px,40vw)}
.search input{border:0;background:none;font:inherit;font-size:14px;color:var(--ink);outline:none;width:100%}
.search input::placeholder{color:var(--muted)}
.search svg{flex:0 0 16px;stroke:var(--ink)}
/* layout: sidebar + main */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,3vw,48px);position:relative;z-index:2}
.side{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding:22px 20px;background:var(--soft);border-radius:24px;margin-top:8px}
.side h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin:16px 0 6px;color:var(--muted)}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:0 -10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}
.side a i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.side a:hover{background:var(--soft2)}
.side a.hide{display:none}
.side .count{font-size:13px;color:var(--muted);margin-bottom:6px}
.jump{display:none;width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:15px;margin-bottom:12px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:32px;align-items:end;padding:36px 0 36px}
.intro .dot{width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
body.dark .intro .dot{background:#fff}
.intro .dot i{width:18px;height:18px;border-radius:50%;border:5px solid var(--green)}
.intro p{font-size:16px;max-width:360px}
h1{font-weight:300;font-size:clamp(48px,7.4vw,118px);line-height:1;letter-spacing:-.03em}
h1 em{font-style:normal;background:linear-gradient(transparent 64%,var(--green) 64%,var(--green) 86%,transparent 86%)}
body.dark h1 em{color:#fff;background:none;color:var(--green)}
.rings{position:absolute;top:-40px;right:-140px;width:640px;height:540px;pointer-events:none;z-index:1}
/* carousel */
.main{min-width:0}
.trackwrap{margin-right:calc(-1*clamp(20px,3.5vw,64px))}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px clamp(20px,3.5vw,64px) 22px 0;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(300px,30vw,500px);aspect-ratio:1.42;border-radius:28px;position:relative;overflow:hidden;scroll-snap-align:start;text-align:left;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;color:#2A4356;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card .pic{position:absolute;top:20px;right:20px;width:54%;height:50%;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.45)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .go{position:absolute;top:22px;left:22px;width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;border:1.4px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;margin-bottom:8px;align-self:flex-start}
.card b{font-size:clamp(20px,1.9vw,28px);font-weight:500;line-height:1.1;max-width:62%}
.card small{font-size:14px;margin-top:6px}
.c0{background:var(--green)}.c1{background:var(--sky)}.c2{background:var(--sage)}.c3{background:var(--mauve)}.c4{background:var(--mist)}.c5{background:var(--stone)}.c6{background:var(--pale)}
.progress{margin-right:0;height:6px;border-radius:6px;background:var(--soft);position:relative}
.progress i{position:absolute;top:0;height:100%;border-radius:6px;background:var(--ink)}
body.dark .progress i{background:var(--green)}
.empty{padding:20px 0;color:var(--muted);display:none}
footer{padding-top:40px;padding-bottom:36px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* viewer */
.viewer{position:fixed;inset:0;background:rgba(20,32,42,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.viewer.on{display:flex}
.panel{background:var(--panel);border-radius:28px;width:min(1280px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 330px}
.media{background:#1d3040;display:flex;align-items:center;justify-content:center;min-height:300px}
.media img{width:100%;height:auto;display:block}
.text{padding:28px;position:relative}
.text h3{font-weight:400;font-size:26px;line-height:1.1;margin:10px 0 16px}
.text ol{list-style:none;counter-reset:s}
.text li{counter-increment:s;position:relative;padding-left:36px;margin-bottom:12px;font-size:15px}
.text li:before{content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--green);color:#2A4356;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tip{margin-top:16px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
body.dark .tip{background:var(--soft2)}
.close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:var(--soft)}
@media (max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.jump{display:block}.hero{grid-template-columns:1fr}.bar{flex-wrap:wrap}.pills{order:3;width:100%}.panel{grid-template-columns:1fr}}
</style>
</head>

  <div class="text"><button class="close" id="close" aria-label="Close">✕</button><span class="badge" id="vbadge"></span><h3 id="title"></h3><ol id="steps"></ol><div class="tip" id="tip"></div></div>

<script>
// ---- Topics. Add one entry per how-to. id = link anchor (…/help.html#crop-image).
// media = file name (without extension) of the GIF + JPG in assets/GIFs/. Demo topics reuse two recordings for now.
const DIR = "assets/GIFs/";
const RAW = "https://raw.githubusercontent.com/IdeerCreative/ideer_web_assets/main/assets/GIFs/";
const TOPICS = [
 {id:"crop-image",group:"Images",title:"Crop an image",media:"crop-image",time:"25 sec",
  steps:["Click the picture","Open the <b>Picture Format</b> tab","Click <b>Crop</b> (right-hand end of the ribbon)","Drag the picture or its corners to reposition it","Click <b>Crop</b> again to finish"],
  tip:"In a picture placeholder, <b>Crop → Fill</b> fills the frame and <b>Crop → Fit</b> shows the whole picture."},
 {id:"replace-picture",group:"Images",title:"Replace a picture",media:"crop-image",time:"15 sec",
  steps:["Right-click the picture","Choose <b>Change Picture</b>","Choose <b>From a File…</b> and pick your image","The new picture keeps the same size and position"]},
 {id:"fill-fit",group:"Images",title:"Fill or fit a picture in its frame",media:"crop-image",time:"15 sec",
  steps:["Click the picture","Open the <b>Picture Format</b> tab","Click the small arrow under <b>Crop</b>","Choose <b>Fill</b> to fill the frame, or <b>Fit</b> to show the whole picture","Click <b>Crop</b> to finish"]},
 {id:"link-text",group:"Text and links",title:"Link text",media:"link-text",time:"25 sec",
  steps:["Select the text you want to link","Right-click and choose <b>Link…</b> (or Cmd+K / Ctrl+K)","Type or paste the web address, then click <b>OK</b>","Click away – the text is now a link"],
  tip:"Use <b>This Document</b> in the Link window to link to another slide. Links work in Slide Show."},
 {id:"link-button",group:"Text and links",title:"Link a button to another slide",media:"link-text",time:"20 sec",
  steps:["Click the edge of the button so the whole shape is selected","Press Cmd+K / Ctrl+K (or <b>Insert → Link</b>)","Choose <b>This Document</b>","Pick the slide to jump to, then click <b>OK</b>"],
  tip:"Links only work in Slide Show."},
 {id:"format-painter",group:"Text and links",title:"Copy formatting with Format Painter",media:"link-text",time:"15 sec",
  steps:["Click inside the text that has the style you want","On the <b>Home</b> tab, click <b>Format Painter</b> (the brush)","Drag across the text you want to change"],
  tip:"Double-click the brush to apply it several times; press Esc to stop."},
 {id:"green-words",group:"Text and links",title:"Turn key words green",media:"link-text",time:"15 sec",
  steps:["Select the word or phrase","On the <b>Home</b> tab, click the arrow next to <b>Font Colour</b>","Choose the Continu green from <b>Theme Colours</b>"],
  tip:"Highlight one short phrase per title – the words that carry the message."},
 {id:"fit-text",group:"Text and links",title:"Make text fit without shrinking it",media:"link-text",time:"20 sec",
  steps:["Click into the text box and check where the text runs past the box","Shorten the copy – aim for the same number of lines as the original","Keep the font size as it is; never resize the box"],
  tip:"The template is designed for a set amount of text per box."},
 {id:"change-layout",group:"Slides and layouts",title:"Change a slide's layout",media:"crop-image",time:"15 sec",
  steps:["Select the slide","On the <b>Home</b> tab, click <b>Layout</b>","Pick the layout you want – your content moves into the new boxes"]},
 {id:"reset-slide",group:"Slides and layouts",title:"Reset a slide to its design",media:"crop-image",time:"10 sec",
  steps:["Select the slide","On the <b>Home</b> tab, click <b>Reset</b>","Positions, sizes and text styles go back to the template design – your words stay"]},
 {id:"duplicate-slide",group:"Slides and layouts",title:"Duplicate a slide",media:"crop-image",time:"10 sec",
  steps:["Right-click the slide thumbnail on the left","Choose <b>Duplicate Slide</b> (or Cmd+D / Ctrl+D)"]},
 {id:"hide-slide",group:"Slides and layouts",title:"Hide a slide from the presentation",media:"crop-image",time:"10 sec",
  steps:["Right-click the slide thumbnail","Choose <b>Hide Slide</b>","It stays in the file but is skipped in Slide Show"]},
 {id:"sections",group:"Slides and layouts",title:"Organise slides into sections",media:"crop-image",time:"20 sec",
  steps:["Right-click between two slide thumbnails","Choose <b>Add Section</b> and give it a name","Click the arrow beside a section name to collapse or expand it"]},
 {id:"save-copy",group:"Files and presenting",title:"Save your deck as a new file",media:"link-text",time:"10 sec",
  steps:["Click <b>File → Save As…</b>","Give the deck a new name, e.g. “Continu – Company name”","Click <b>Save</b> – the template stays untouched"]},
 {id:"speaker-notes",group:"Files and presenting",title:"Add speaker notes",media:"link-text",time:"10 sec",
  steps:["Click <b>Click to add notes</b> below the slide (or <b>View → Notes</b>)","Type your notes","They show in Presenter View, not on the slide"]}
];
const $ = id => document.getElementById(id);
const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A4356" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const GROUPS = [...new Set(TOPICS.map(t => t.group))];
const colour = t => "c" + (TOPICS.indexOf(t) % 6);
let area = "All";
function src(img, file){ img.onerror = () => { if(!img.src.startsWith(RAW)) img.src = RAW + file; }; img.src = DIR + file; }
function matches(t){ const f = $("q").value.trim().toLowerCase(); return (area==="All"||t.group===area) && (!f || (t.title+" "+t.group+" "+t.steps.join(" ")).toLowerCase().includes(f)); }
function pills(){
  $("pills").innerHTML = ["All",...GROUPS].map(g => `<button class="pill${g===area?' on':''}" data-g="${g}">${g}</button>`).join("");
  document.querySelectorAll(".pill").forEach(p => p.onclick = () => { area = p.dataset.g; pills(); render(); });
}
function menu(){
  $("menu").innerHTML = GROUPS.map(g => `<h4>${g}</h4>` + TOPICS.filter(t => t.group===g).map(t =>
    `<a href="#${t.id}" data-id="${t.id}"><i class="${colour(t)}"></i>${t.title}</a>`).join("")).join("");
  $("jump").innerHTML = `<option value="">Jump to a topic…</option>` + GROUPS.map(g => `<optgroup label="${g}">` +
    TOPICS.filter(t => t.group===g).map(t => `<option value="${t.id}">${t.title}</option>`).join("") + `</optgroup>`).join("");
  $("jump").onchange = e => { if(e.target.value) location.hash = e.target.value; e.target.value = ""; };
}
function render(){
  const list = TOPICS.filter(matches);
  $("track").innerHTML = list.map(t =>
    `<button class="card ${colour(t)}" data-id="${t.id}" aria-label="${t.title}">
       <span class="go">${arrow}</span><span class="pic"><img alt="" data-file="${t.media}.jpg"></span>
       <span class="badge">${t.group}</span><b>${t.title}</b><small>${t.steps.length} steps · ${t.time}</small></button>`).join("");
  document.querySelectorAll(".card img").forEach(im => src(im, im.dataset.file));
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { location.hash = c.dataset.id; });
  document.querySelectorAll(".side a").forEach(a => a.classList.toggle("hide", !list.some(t => t.id===a.dataset.id)));
  document.querySelectorAll(".side h4").forEach(h => { let n=h.nextElementSibling, any=false; while(n && n.tagName==="A"){ if(!n.classList.contains("hide")) any=true; n=n.nextElementSibling; } h.style.display = any ? "" : "none"; });
  $("count").textContent = list.length === TOPICS.length ? `${TOPICS.length} topics` : `${list.length} of ${TOPICS.length} topics`;
  $("empty").style.display = list.length ? "none" : "block"; $("track").scrollLeft = 0; prog();
}
function prog(){
  const t = $("track"), max = t.scrollWidth - t.clientWidth, w = t.clientWidth / t.scrollWidth;
  $("progress").style.visibility = max > 4 ? "visible" : "hidden";
  $("thumb").style.width = (w*100) + "%"; $("thumb").style.left = (max>0 ? t.scrollLeft/max*(1-w)*100 : 0) + "%";
}
function open(id){
  const t = TOPICS.find(x => x.id === id); if(!t){ shut(); return; }
  src($("gif"), t.media + ".gif"); $("gif").alt = t.title + " – animated how-to";
  $("vbadge").textContent = t.group; $("title").textContent = t.title;
  $("steps").innerHTML = t.steps.map(s => `<li>${s}</li>`).join("");
  $("tip").innerHTML = t.tip || ""; $("tip").style.display = t.tip ? "block" : "none";
  $("viewer").classList.add("on"); document.title = t.title + " · Continu PowerPoint Help";
}
function shut(){ $("viewer").classList.remove("on"); $("gif").removeAttribute("src"); document.title = "Continu · PowerPoint Help"; }
$("close").onclick = () => { history.replaceState(null,"",location.pathname); shut(); };
$("viewer").onclick = e => { if(e.target.id === "viewer") $("close").onclick(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") $("close").onclick(); });
$("q").oninput = render; $("track").addEventListener("scroll", prog); window.addEventListener("resize", prog);
window.addEventListener("hashchange", () => open(location.hash.slice(1)));
pills(); menu(); render(); if(location.hash) open(location.hash.slice(1));
</script>
</body>
