<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continu · PowerPoint Help</title>
<style>
:root{--navy:#2A4356;--navy2:#324E64;--green:#B5EB03;--mist:#E6EAE4;--white:#fff;--muted:#B8C2B2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--white);font-family:Effra,"Inter","Segoe UI",system-ui,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-weight:300;font-size:clamp(30px,5vw,46px);letter-spacing:-.01em;line-height:1.05}
h1 span{color:var(--green)}
.logo{display:block;height:40px;width:auto;margin-bottom:26px}
.sub{color:var(--muted);font-size:15px;margin-top:8px}
.search{background:var(--navy2);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:11px 18px;color:#fff;font:inherit;font-size:15px;width:min(320px,100%)}
.search::placeholder{color:var(--muted)}
.group{margin-top:28px}
.group h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--navy2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;text-align:left;color:#fff;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--green);outline:none}
.tile b{display:block;font-size:17px;font-weight:500}
.tile small{color:var(--muted);font-size:13px}
/* viewer */
.viewer{position:fixed;inset:0;background:rgba(10,20,28,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.viewer.on{display:flex}
.panel{background:var(--navy);border-radius:20px;max-width:1180px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 300px;gap:0;border:1px solid rgba(255,255,255,.1)}
.panel .media{background:#000;display:flex;align-items:center;justify-content:center;border-radius:20px 0 0 20px;min-height:300px}
.panel .media img{width:100%;height:auto;display:block}
.panel .text{padding:24px}
.panel h3{font-weight:400;font-size:24px;line-height:1.15;margin-bottom:14px}
.panel ol{padding-left:0;list-style:none;counter-reset:s}
.panel li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:10px;font-size:15px}
.panel li:before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--navy);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.panel .tip{margin-top:14px;background:var(--navy2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mist)}
.close{position:fixed;top:16px;right:20px;background:var(--green);color:var(--navy);border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;z-index:11;display:none}
.viewer.on + .close{display:block}
.empty{color:var(--muted);margin-top:24px;display:none}
footer{margin-top:48px;color:var(--muted);font-size:13px}
@media (max-width:820px){.panel{grid-template-columns:1fr}.panel .media{border-radius:20px 20px 0 0}}
</style>
</head>

</div></div>
<button class="close" id="close">Close ✕</button>
<script>
// ---- Add a topic: one entry here. id = the link anchor (…/help/#crop-image) ----
const GIFS = "assets/GIFs/";            // GIFs folder; a raw.githubusercontent.com link is the fallback
const GIFS_FALLBACK = "https://raw.githubusercontent.com/IdeerCreative/ideer_web_assets/main/assets/GIFs/";
const TOPICS = [
  {id:"crop-image", group:"Images", title:"Crop an image", gif:"crop-image.gif",
   steps:["Click the picture","Open the <b>Picture Format</b> tab","Click <b>Crop</b> (right-hand end of the ribbon)","Drag the picture or its corners to reposition it","Click <b>Crop</b> again to finish"],
   tip:"In a picture placeholder, <b>Crop → Fill</b> fills the frame and <b>Crop → Fit</b> shows the whole picture."},
  {id:"link-text", group:"Text and links", title:"Link text", gif:"link-text.gif",
   steps:["Select the text you want to link","Right-click and choose <b>Link…</b> (or Cmd+K / Ctrl+K)","Type or paste the web address, then click <b>OK</b>","Click away – the text is now a link"],
   tip:"Use <b>This Document</b> in the Link window to link to another slide. Links work in Slide Show."}
];
const $ = id => document.getElementById(id);
function render(filter=""){
  const f = filter.trim().toLowerCase(); const groups = {};
  TOPICS.filter(t => !f || (t.title+" "+t.group+" "+t.steps.join(" ")).toLowerCase().includes(f))
        .forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  $("groups").innerHTML = Object.entries(groups).map(([g,ts]) =>
    `<section class="group"><h2>${g}</h2><div class="grid">${ts.map(t =>
      `<button class="tile" data-id="${t.id}"><b>${t.title}</b><small>${t.steps.length} steps</small></button>`).join("")}</div></section>`).join("");
  $("empty").style.display = Object.keys(groups).length ? "none" : "block";
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}
function open(id){
  const t = TOPICS.find(x => x.id === id); if(!t){ shut(); return; }
  $("gif").onerror = () => { if(!$("gif").src.startsWith(GIFS_FALLBACK)) $("gif").src = GIFS_FALLBACK + t.gif; }; $("gif").src = GIFS + t.gif; $("gif").alt = t.title + " – animated how-to";
  $("title").textContent = t.title; $("steps").innerHTML = t.steps.map(s => `<li>${s}</li>`).join("");
  $("tip").innerHTML = t.tip || ""; $("tip").style.display = t.tip ? "block" : "none";
  $("viewer").classList.add("on"); document.title = t.title + " · Continu PowerPoint Help";
}
function shut(){ $("viewer").classList.remove("on"); $("gif").src = ""; document.title = "Continu · PowerPoint Help"; }
$("close").onclick = () => { history.replaceState(null,"",location.pathname); shut(); };
$("viewer").onclick = e => { if(e.target.id === "viewer") $("close").onclick(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") $("close").onclick(); });
$("q").oninput = e => render(e.target.value);
window.addEventListener("hashchange", () => open(location.hash.slice(1)));
render(); if(location.hash) open(location.hash.slice(1));
</script>
