<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continu · PowerPoint Help</title>
<style>
:root{--navy:#2A4356;--navy2:#324E64;--green:#B5EB03;--sage:#9AC490;--sky:#A5D4F0;--mist:#C2D0DA;--mauve:#CEA1C6;--stone:#B8C2B2;--paper:#F3F5F2;--line:#E3E7E1;--muted:#5F7383}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{color:var(--navy);font-family:Effra,"Inter","Segoe UI",system-ui,sans-serif;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px clamp(20px,4vw,64px);position:relative;z-index:2}
.logo{height:34px;width:auto;color:var(--navy);display:block}
.pills{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:5px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:999px;font-size:14px;color:var(--navy);transition:background .15s}
.pill:hover{background:#fff}
.pill.on{background:#fff;box-shadow:0 1px 3px rgba(42,67,86,.12);font-weight:600}
.tools{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:9px 16px;width:min(260px,40vw)}
.search input{border:0;background:none;font:inherit;font-size:14px;color:var(--navy);outline:none;width:100%}
.search svg{flex:0 0 16px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:40px;align-items:end;padding:56px clamp(20px,4vw,64px) 40px;position:relative;z-index:1}
.intro .dot{width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.intro .dot i{width:18px;height:18px;border-radius:50%;border:5px solid var(--green)}
.intro p{font-size:16px;max-width:340px;color:var(--navy)}
h1{font-weight:500;font-size:clamp(48px,8vw,112px);line-height:.98;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--navy);background:linear-gradient(transparent 62%,var(--green) 62%,var(--green) 88%,transparent 88%)}
.rings{position:absolute;top:-40px;right:-120px;width:620px;height:520px;pointer-events:none;z-index:0}
/* carousel */
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px clamp(20px,4vw,64px) 24px;scrollbar-width:none;position:relative;z-index:1}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(300px,31vw,520px);aspect-ratio:1.42;border-radius:28px;position:relative;overflow:hidden;scroll-snap-align:start;text-align:left;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card .pic{position:absolute;top:20px;right:20px;width:54%;height:66%;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%,0 30%);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.4)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .go{position:absolute;top:22px;left:22px;width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;border:1.4px solid var(--navy);border-radius:999px;padding:1px 9px;font-size:12px;margin-bottom:8px;align-self:flex-start}
.card b{font-size:clamp(20px,2vw,28px);font-weight:500;line-height:1.1;max-width:60%}
.card small{font-size:14px;margin-top:6px}
.c0{background:var(--green)}.c1{background:var(--sky)}.c2{background:var(--sage)}.c3{background:var(--mauve)}.c4{background:var(--mist)}.c5{background:var(--stone)}
.progress{margin:6px clamp(20px,4vw,64px) 0;height:6px;border-radius:6px;background:var(--paper);position:relative}
.progress i{position:absolute;top:0;height:100%;border-radius:6px;background:var(--navy);transition:left .1s}
.empty{padding:20px clamp(20px,4vw,64px);color:var(--muted);display:none}
footer{padding:40px clamp(20px,4vw,64px) 36px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* viewer */
.viewer{position:fixed;inset:0;background:rgba(42,67,86,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.viewer.on{display:flex}
.panel{background:#fff;border-radius:28px;width:min(1280px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 320px}
.media{background:var(--navy);display:flex;align-items:center;justify-content:center;min-height:300px}
.media img{width:100%;height:auto;display:block}
.text{padding:28px;position:relative}
.text h3{font-weight:500;font-size:26px;line-height:1.1;margin:10px 0 16px}
.text ol{list-style:none;counter-reset:s}
.text li{counter-increment:s;position:relative;padding-left:36px;margin-bottom:12px;font-size:15px}
.text li:before{content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--green);color:var(--navy);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tip{margin-top:16px;background:var(--paper);border-radius:14px;padding:12px 14px;font-size:14px}
.close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:var(--paper);font-size:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}.pills{order:3;width:100%}.bar{flex-wrap:wrap}.panel{grid-template-columns:1fr}.card .pic{width:48%}}
</style>
</head>

  <nav class="pills" id="pills" aria-label="Help areas"></nav>
  <div class="tools"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A4356" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search help" aria-label="Search help topics"></label></div>
</div>
<section class="hero">
  <div class="intro"><div class="dot"><i></i></div><p>Short animated how-tos for the Continu PowerPoint template. Pick a topic to watch every click, step by step.</p></div>
  <h1>PowerPoint<br><em>help</em></h1>
</section>
<div class="track" id="track"></div>
<div class="progress" id="progress"><i id="thumb"></i></div>
<p class="empty" id="empty">No topic matches that yet.</p>
<footer><span>Continu · PowerPoint help for the Continu template</span><span>Each animation loops – watch it as many times as you like.</span></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true"><div class="panel">
  <div class="media"><img id="gif" alt=""></div>
  <div class="text"><button class="close" id="close" aria-label="Close">✕</button><span class="badge" id="vbadge"></span><h3 id="title"></h3><ol id="steps"></ol><div class="tip" id="tip"></div></div>
</div></div>
<script>
// ---- Add a topic: one entry. id = link anchor (…/help.html#crop-image); gif + jpg live in assets/GIFs/ ----
const DIR = "assets/GIFs/";
const RAW = "https://raw.githubusercontent.com/IdeerCreative/ideer_web_assets/main/assets/GIFs/";
const TOPICS = [
  {id:"crop-image", group:"Images", title:"Crop an image", time:"25 sec",
   steps:["Click the picture","Open the <b>Picture Format</b> tab","Click <b>Crop</b> (right-hand end of the ribbon)","Drag the picture or its corners to reposition it","Click <b>Crop</b> again to finish"],
   tip:"In a picture placeholder, <b>Crop → Fill</b> fills the frame and <b>Crop → Fit</b> shows the whole picture."},
  {id:"link-text", group:"Text and links", title:"Link text", time:"25 sec",
   steps:["Select the text you want to link","Right-click and choose <b>Link…</b> (or Cmd+K / Ctrl+K)","Type or paste the web address, then click <b>OK</b>","Click away – the text is now a link"],
   tip:"Use <b>This Document</b> in the Link window to link to another slide. Links work in Slide Show."}
];
const $ = id => document.getElementById(id);
const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A4356" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg>';
let area = "All";
function src(img, file){ img.onerror = () => { if(!img.src.startsWith(RAW)) img.src = RAW + file; }; img.src = DIR + file; }
function pills(){
  const groups = ["All", ...new Set(TOPICS.map(t => t.group))];
  $("pills").innerHTML = groups.map(g => `<button class="pill${g===area?' on':''}" data-g="${g}">${g}</button>`).join("");
  document.querySelectorAll(".pill").forEach(p => p.onclick = () => { area = p.dataset.g; pills(); render(); });
}
function render(){
  const f = $("q").value.trim().toLowerCase();
  const list = TOPICS.filter(t => (area==="All" || t.group===area) && (!f || (t.title+" "+t.group+" "+t.steps.join(" ")).toLowerCase().includes(f)));
  $("track").innerHTML = list.map((t,i) =>
    `<button class="card c${TOPICS.indexOf(t)%6}" data-id="${t.id}" aria-label="${t.title}">
       <span class="go">${arrow}</span><span class="pic"><img alt="" data-file="${t.id}.jpg"></span>
       <span class="badge">${t.group}</span><b>${t.title}</b><small>${t.steps.length} steps · ${t.time}</small></button>`).join("");
  document.querySelectorAll(".card img").forEach(im => src(im, im.dataset.file));
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { location.hash = c.dataset.id; });
  $("empty").style.display = list.length ? "none" : "block"; $("track").scrollLeft = 0; prog();
}
function prog(){
  const t = $("track"), max = t.scrollWidth - t.clientWidth, w = t.clientWidth / t.scrollWidth;
  $("progress").style.visibility = max > 4 ? "visible" : "hidden";
  $("thumb").style.width = (w*100) + "%"; $("thumb").style.left = (max>0 ? t.scrollLeft/max*(1-w)*100 : 0) + "%";
}
function open(id){
  const t = TOPICS.find(x => x.id === id); if(!t){ shut(); return; }
  src($("gif"), t.id + ".gif"); $("gif").alt = t.title + " – animated how-to";
  $("vbadge").textContent = t.group; $("title").textContent = t.title;
  $("steps").innerHTML = t.steps.map(s => `<li>${s}</li>`).join("");
  $("tip").innerHTML = t.tip || ""; $("tip").style.display = t.tip ? "block" : "none";
  $("viewer").classList.add("on"); document.title = t.title + " · Continu PowerPoint Help";
}
function shut(){ $("viewer").classList.remove("on"); $("gif").removeAttribute("src"); document.title = "Continu · PowerPoint Help"; }
$("close").onclick = () => { history.replaceState(null,"",location.pathname); shut(); };
$("viewer").onclick = e => { if(e.target.id === "viewer") $("close").onclick(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") $("close").onclick(); });
$("q").oninput = render; $("track").addEventListener("scroll", prog); window.addEventListener("resize", prog);
window.addEventListener("hashchange", () => open(location.hash.slice(1)));
pills(); render(); if(location.hash) open(location.hash.slice(1));
</script>
